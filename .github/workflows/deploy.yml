name: Deploy to GitHub Pages

# Despliega el sitio en GitHub Pages en cada push a esta rama.
# También se puede lanzar manualmente desde la pestaña Actions.
on:
  push:
    branches: [deploy/github-pages]
  workflow_dispatch:

# Permisos mínimos que requiere el despliegue de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un único despliegue concurrente (no cancela el que esté en curso).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build con Astro
        # Acción oficial de Astro: instala dependencias, compila y sube el artefacto.
        # Respeta `site` y `base` de astro.config.mjs automáticamente.
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
